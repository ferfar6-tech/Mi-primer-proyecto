<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador web</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Contador web</h1>
      <p id="counter" class="counter">0</p>

      <div class="buttons">
        <button id="decrement-btn" type="button">Restar -1</button>
        <button id="increment-btn" type="button">Aumentar +1</button>
        <button id="reset-btn" type="button" class="secondary">Reiniciar</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
